<script>
const slider = document.querySelector('#offset');
const logo = document.querySelector('.home img');
const reply = document.querySelector('#reply');
function update() {
  const value = slider.valueAsNumber;
  const offset = Math.abs(value) + ' px ' + (value < 0 ? 'up' : 'down');
  logo.style.transform = 'translateY(' + value + 'px)';
  slider.setAttribute('aria-valuetext', value ? offset : 'Live position');
  reply.textContent = value ? 'Tell me: Move the Moonwell logo ' + offset + ' from its live position.' : 'Tell me: Keep the Moonwell logo at its live position.';
}
slider.addEventListener('input', update);
update();
</script></html>
